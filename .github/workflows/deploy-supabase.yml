name: Deploy Supabase account backend

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref yfbwxqicqdnjpmmhdyeh --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Set initial admin setup key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INITIAL_ADMIN_SETUP_KEY: ${{ secrets.INITIAL_ADMIN_SETUP_KEY }}
        run: |
          if [ -n "$INITIAL_ADMIN_SETUP_KEY" ]; then
            supabase secrets set "INITIAL_ADMIN_SETUP_KEY=$INITIAL_ADMIN_SETUP_KEY" --project-ref yfbwxqicqdnjpmmhdyeh
          else
            echo "INITIAL_ADMIN_SETUP_KEY is not configured; leaving Supabase secret unchanged."
          fi

      - name: Deploy account Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy account-api --project-ref yfbwxqicqdnjpmmhdyeh
